name: Normalize issue 71 documentation example

on:
  push:
    branches:
      - autodev/issue-71-autodev-run

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove duplicate canonical path in CONTRIBUTING
        shell: python
        run: |
          from pathlib import Path
          path = Path("CONTRIBUTING.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("\\.autodev-run|\\.autodev-run", "\\.autodev-run")
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/issue-71-cleanup.yml").unlink()
      - name: Verify rename surface
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git grep -n -F '.codex-run' -- . ':(exclude)docs/run-real-issue.md' || true)"
          test -z "$unexpected"
          test "$(grep -o '\\.autodev-run|\\.autodev-run' CONTRIBUTING.md | wc -l)" -eq 0
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "#71: normalize runtime directory documentation"
          git push origin HEAD:autodev/issue-71-autodev-run
