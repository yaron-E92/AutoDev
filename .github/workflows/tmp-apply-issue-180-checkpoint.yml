name: Apply issue 180 checkpoint

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/issue-180-python-modularization
      - name: Reconstruct and apply checkpoint
        shell: bash
        env:
          EXPECTED_STAGING_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cat .autodev-checkpoint-xz/chunk* | base64 -d | xz -d > /tmp/checkpoint.patch
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git reset --hard d19c2ce6207c8a8dbe42d6105670fab25d0ed8b3
          git am /tmp/checkpoint.patch
          git push --force-with-lease=refs/heads/agent/issue-180-python-modularization:${EXPECTED_STAGING_HEAD} origin HEAD:refs/heads/agent/issue-180-python-modularization
