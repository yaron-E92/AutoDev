name: Issue 181 remove remaining compatibility facades

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: issue-181-facades-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  remove-facades:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Normalize facade migration edge cases
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('scripts/issue_181_remove_remaining_facades.py')
          text = migration.read_text(encoding='utf-8')
          marker = '        "with_headroom_role": "provider_headroom",\n'
          addition = marker + ''.join(
              f'        "{name}": "headroom",\n'
              for name in (
                  'HeadroomConfig',
                  'HeadroomError',
                  'headroom_config_from_values',
                  'prepare_prompt',
                  'proxy_headers',
              )
          )
          if marker not in text:
              raise SystemExit('model-provider mapping marker missing')
          text = text.replace(marker, addition, 1)
          old = '''            for facade in FACADES:\n                if re.search(rf"\\b(?:automation\\.)?{re.escape(facade)}\\b", text):\n                    leftovers.append(f"{path.relative_to(ROOT)}: {facade}")\n'''
          new = '''            for facade in FACADES:\n                patterns = (\n                    rf"\\bautomation\\.{re.escape(facade)}\\b",\n                    rf"\\bfrom\\s+automation\\s+import[^\\n]*\\b{re.escape(facade)}\\b",\n                    rf"\\b{re.escape(facade)}\\.",\n                    rf"\\bpatch\\.object\\(\\s*{re.escape(facade)}\\b",\n                )\n                if any(re.search(pattern, text) for pattern in patterns):\n                    leftovers.append(f"{path.relative_to(ROOT)}: {facade}")\n'''
          if old not in text:
              raise SystemExit('facade leftover detector marker missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              '    if leftovers:\n        raise SystemExit("facade references remain:\\n" + "\\n".join(leftovers))\n',
              '    if leftovers:\n        print("facade references still pending test retargeting:\\n" + "\\n".join(leftovers))\n',
              1,
          )
          migration.write_text(text, encoding='utf-8')

          path = Path('automation/queue_selection.py')
          text = path.read_text(encoding='utf-8')
          start = text.find('class _IssueQueueCompat:')
          end = text.find('ROADMAP_PATH =', start)
          if start < 0 or end < 0:
              raise SystemExit('queue selection compatibility block not found')
          text = text[:start] + text[end:]
          text = text.replace('issue_queue._run_gh', '_run_gh')
          text = text.replace('issue_queue._json_result', '_json_result')
          text = text.replace('issue_queue.inspect_queue', 'inspect_queue')
          text = text.replace('issue_queue.reconcile_queue', 'reconcile_queue')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Retarget facade consumers to owner modules
        run: python scripts/issue_181_remove_remaining_facades.py

      - name: Retarget facade-free test ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path: str, pairs: tuple[tuple[str, str], ...]) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              target.write_text(text, encoding='utf-8')

          replace('tests/test_execution_classification_hooks.py', (
              ('execution_classification_hooks.issue_queue', 'execution_classification_hooks.queue_github'),
              ('execution_classification_evidence.issue_queue', 'execution_classification_evidence.queue_github'),
          ))
          replace('tests/test_queue_claim_selection.py', (
              ('patch.object(\n                queue_selection.issue_queue,', 'patch.object(\n                queue_selection,'),
          ))
          replace('tests/test_provider_agnostic.py', (
              ('automation/model_providers.py', 'automation/provider_factory.py'),
          ))

          path = Path('tests/test_privacy_grants.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '"automation.privacy_grants.sys.stdin"',
              '"automation.privacy_grant_hooks.sys.stdin"',
          )
          marker = '    def test_privacy_consent_cli_refuses_headless_creation(self):\n'
          start = text.find(marker)
          end = text.find('\n    def ', start + len(marker))
          if start < 0:
              raise SystemExit('privacy CLI test marker missing')
          if end < 0:
              end = text.find('\n\nif __name__', start)
          section = text[start:end].replace(
              '"automation.privacy_grant_hooks.sys.stdin"',
              '"automation.privacy_grant_cli.sys.stdin"',
          )
          path.write_text(text[:start] + section + text[end:], encoding='utf-8')

          path = Path('tests/test_role_workflow_hooks.py')
          text = path.read_text(encoding='utf-8')
          if 'import automation.repair_budget_resume as repair_budget_resume' not in text:
              text = text.replace(
                  'from __future__ import annotations\n',
                  'from __future__ import annotations\n\nimport automation.repair_budget_resume as repair_budget_resume\n',
                  1,
              )
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_distributed_claims.py')
          text = path.read_text(encoding='utf-8')
          marker = '    def test_stale_reconcile_restores_running_label_when_claim_cas_loses(self):\n'
          start = text.find(marker)
          end = text.find('\n\nif __name__', start)
          if start < 0 or end < 0:
              raise SystemExit('distributed claim stale-reconcile test marker missing')
          section = text[start:end]
          section = section.replace('patch.object(claim_repository, "list_claims"', 'patch.object(claim_recovery, "list_claims"')
          section = section.replace(
              'patch.object(\n            claim_repository,\n            "_delete_with_lease"',
              'patch.object(\n            claim_recovery,\n            "_delete_with_lease"',
          )
          text = text[:start] + section + text[end:]
          if 'import automation.claim_recovery as claim_recovery' not in text:
              text = text.replace(
                  'from __future__ import annotations\n',
                  'from __future__ import annotations\n\nimport automation.claim_recovery as claim_recovery\n',
                  1,
              )
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_scheduler_claims.py')
          text = path.read_text(encoding='utf-8')
          owners = {
              'load_claim_policy': 'claim_identity',
              'worker_identity': 'claim_identity',
              'reconcile_stale_claims': 'claim_recovery',
              'HeartbeatLease': 'claim_lease',
              'list_claims': 'claim_repository',
              'acquire_claim': 'claim_lease',
              'release_claim': 'claim_lease',
          }
          for symbol, owner in owners.items():
              text = re.sub(
                  rf'scheduler\.distributed_claims(\s*,\s*["\']{symbol}["\'])',
                  rf'scheduler.{owner}\1',
                  text,
              )
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_scheduler_health.py')
          text = path.read_text(encoding='utf-8')
          for old, new in (
              ('patch.object(scheduler_health.issue_queue, "inspect_queue"', 'patch.object(queue_workflow, "inspect_queue"'),
              ('patch.object(\n        scheduler_health.issue_queue,\n        "list_issues"', 'patch.object(\n        queue_github,\n        "list_issues"'),
              ('patch.object(\n        scheduler_health.queue_selection,', 'patch.object(\n        queue_selection,'),
              ('patch.object(\n            scheduler_health.scheduler,', 'patch.object(\n            scheduler,'),
          ):
              text = text.replace(old, new)
          if 'import automation.queue_workflow as queue_workflow' not in text:
              text = text.replace(
                  'from __future__ import annotations\n',
                  'from __future__ import annotations\n\nimport automation.queue_workflow as queue_workflow\nimport automation.queue_github as queue_github\n',
                  1,
              )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile maintained Python
        run: python -m compileall -q automation area_reader tests

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Reject compatibility facades and references
        shell: bash
        run: |
          set -euo pipefail
          facades=(model_providers issue_queue distributed_claims privacy_grants scheduler_health semantic_repair_budget)
          for facade in "${facades[@]}"; do
            test ! -e "automation/${facade}.py"
            if git grep -n -E "(automation\.${facade}|from automation import.*${facade}|${facade}\.)" -- automation area_reader tests ':!scripts/issue_181_*'; then
              echo "Compatibility facade reference remains: ${facade}" >&2
              exit 1
            fi
          done
          if git grep -n -F '_IssueQueueCompat' -- automation tests; then
            echo 'Queue selection compatibility object remains.' >&2
            exit 1
          fi

      - name: Commit verified facade removal
        shell: bash
        run: |
          set -euo pipefail
          git add -A automation area_reader tests
          git reset -- scripts/issue_181_remove_remaining_facades.py || true
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor: remove compatibility aggregation facades'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
