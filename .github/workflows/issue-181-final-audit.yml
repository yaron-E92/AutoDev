name: Issue 181 final dead-code audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Audit current-tree obsolete references
        shell: bash
        run: |
          set -u
          for pattern in \
            'coder-plan' \
            'verification-repair.md|promptTemplates/verifier.md' \
            'opencode_adapter install|opencode_adapter.*install' \
            'AUTODEV_OPENCODE_' \
            'prompt_runner' \
            'Legacy PASS/FAIL|Legacy mode|Legacy compatibility|Legacy configuration|temporary compatibility shim' \
            'resolve_model_config|load_provider_config|create_provider' \
            'resolve_role_configs|resolve_profile_roles|ROLE_FALLBACKS'; do
            echo "=== $pattern ==="
            git grep -n -E "$pattern" -- automation area_reader integrations promptTemplates tests docs README.md CONTRIBUTING.md 2>/dev/null || true
          done
          echo '=== issue-181 scaffolding ==='
          find .github/workflows scripts -maxdepth 2 -type f -name '*181*' -print 2>/dev/null | sort
