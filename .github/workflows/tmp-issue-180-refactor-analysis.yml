name: Issue 180 refactor analysis

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-180-python-modularization
      - name: Archive branch source
        shell: bash
        run: |
          git status --short
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: issue-180-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
