name: Issue 180 coordinator consolidation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: issue-180-coordinators-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Compile migration driver and shared coordination modules
        run: >-
          python -m py_compile
          scripts/issue_180_split_coordinators.py
          automation/coordination_contract.py
          automation/coordination_state.py

      - name: Split generic role coordinator
        run: python scripts/issue_180_split_coordinators.py generic

      - name: Verify generic role coordinator split
        run: |
          python -m compileall -q automation
          python -m unittest \
            tests.test_role_runtime \
            tests.test_role_runtime_compat \
            tests.test_role_runtime_diagnostics \
            tests.test_role_workflow_hooks \
            tests.test_model_roles \
            tests.test_run_resume

      - name: Commit generic coordinator split
        shell: bash
        run: |
          set -euo pipefail
          git add \
            automation/coordination_contract.py \
            automation/coordination_state.py \
            automation/role_coordinator.py \
            automation/role_coord_contract.py \
            automation/role_coord_state.py \
            automation/role_coord_runtime.py \
            automation/role_coord_stages.py \
            automation/role_coord_flow.py \
            automation/role_coord_cli.py
          if git diff --cached --quiet; then
            echo "Generic coordinator already split."
          else
            git diff --cached --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'refactor: split generic role coordinator around shared coordination core'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Split OpenCode coordinator
        run: python scripts/issue_180_split_coordinators.py opencode

      - name: Verify OpenCode coordinator split
        run: |
          python -m compileall -q automation
          python -m unittest \
            tests.test_opencode_coordinator \
            tests.test_opencode_local_coordinator_hardening \
            tests.test_opencode_integration \
            tests.test_opencode_resume \
            tests.test_opencode_shipped_pr_and_ci \
            tests.test_opencode_post_shipment_identity \
            tests.test_opencode_pr_recovery \
            tests.test_opencode_role_runtime_privacy

      - name: Commit OpenCode coordinator split
        shell: bash
        run: |
          set -euo pipefail
          git add \
            automation/opencode_coordinator.py \
            automation/opencode_coord_contract.py \
            automation/opencode_coord_state.py \
            automation/opencode_coord_runtime.py \
            automation/opencode_coord_stages.py \
            automation/opencode_coord_flow.py \
            automation/opencode_coord_cli.py
          if git diff --cached --quiet; then
            echo "OpenCode coordinator already split."
          else
            git diff --cached --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'refactor: split OpenCode coordinator around shared coordination core'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
