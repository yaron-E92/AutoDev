name: Facade prune gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: facade-prune-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Retarget callers and remove pure facades
        run: |
          python scripts/issue_180_facade_guard_patch.py
          python scripts/issue_180_facade_test_patch.py
          python scripts/issue_180_remove_module_facades.py

      - name: Compile canonical Python
        run: python -m compileall -q automation area_reader tests

      - name: Run focused facade-owner suites
        run: |
          python -m unittest \
            tests.test_semantic_verifier \
            tests.test_semantic_repair_budget \
            tests.test_opencode_resume \
            tests.test_opencode_resume_guardrails \
            tests.test_windows_semantic_order \
            tests.test_windows_verification \
            tests.test_workflow_stages \
            tests.test_role_workflow_hooks \
            tests.test_opencode_integration

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Reject removed facade surface
        shell: bash
        run: |
          set -euo pipefail
          test ! -e automation/semantic_verifier.py
          test ! -e automation/windows_verification.py
          test ! -e automation/opencode_resume.py
          if grep -R -n -E 'automation\.(semantic_verifier|windows_verification|opencode_resume)([^A-Za-z0-9_]|$)|from automation import (semantic_verifier|windows_verification|opencode_resume)([^A-Za-z0-9_]|$)' automation tests --include='*.py'; then
            echo 'removed facade references remain' >&2
            exit 1
          fi

      - name: Commit verified facade pruning
        shell: bash
        run: |
          set -euo pipefail
          git add -A automation tests
          if git diff --cached --quiet; then
            echo "Facade pruning already applied."
          else
            git diff --cached --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'refactor: remove compatibility module facades'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
