name: Issue 180 remove legacy runner

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: issue-180-remove-legacy-runner-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove adapter facade and legacy runner
        run: |
          python scripts/issue_180_remove_legacy_runner_patch.py
          python scripts/issue_180_remove_legacy_runner.py

      - name: Compile canonical Python
        run: python -m compileall -q automation area_reader tests

      - name: Run canonical focused tests
        run: |
          python -m unittest \
            tests.test_autodev_cli \
            tests.test_context_optimization \
            tests.test_execution_classification_hooks \
            tests.test_opencode_integration \
            tests.test_opencode_privacy_role_entrypoint \
            tests.test_opencode_role_runtime_privacy \
            tests.test_opencode_resume \
            tests.test_privacy_consent \
            tests.test_privacy_grants \
            tests.test_repo_setup \
            tests.test_role_runtime \
            tests.test_role_runtime_diagnostics \
            tests.test_windows_verification

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Reject removed legacy surface
        shell: bash
        run: |
          set -euo pipefail
          test ! -e automation/opencode_adapter.py
          test ! -e automation/run_real_issue.py
          test ! -e automation/run_real_issue_core.py
          test ! -e tests/test_run_real_issue.py
          test ! -e tests/test_run_resume.py
          test ! -e scripts/run-real-issue.sh
          test ! -e scripts/run-real-issue.ps1
          if find automation -maxdepth 1 -type f \( -name 'issue_runner_*.py' -o -name 'issue_run_*.py' \) | grep .; then
            echo 'legacy issue runner modules remain' >&2
            exit 1
          fi

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Legacy runner cleanup already applied."
          else
            git diff --cached --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'refactor: remove legacy issue runner'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
