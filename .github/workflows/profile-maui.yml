name: Reusable CI profile - MAUI

on:
  workflow_call:
    inputs:
      ref:
        description: Exact caller ref/SHA to validate
        required: false
        type: string
        default: ''
      global_json_file:
        description: global.json path
        required: false
        type: string
        default: global.json
      dotnet_version:
        description: SDK version/range when global_json_file is empty
        required: false
        type: string
        default: ''
      cache:
        description: Enable setup-dotnet NuGet caching for all MAUI legs
        required: false
        type: boolean
        default: false
      cache_dependency_path:
        description: packages.lock.json path/glob used when cache is enabled
        required: false
        type: string
        default: ''

      headless_enabled:
        description: Run the shared/headless .NET validation leg
        required: false
        type: boolean
        default: true
      headless_runner:
        description: Runner for shared/headless validation
        required: false
        type: string
        default: ubuntu-latest
      headless_setup_command:
        required: false
        type: string
        default: ''
      headless_restore_command:
        required: false
        type: string
        default: 'dotnet restore'
      headless_build_command:
        required: false
        type: string
        default: 'dotnet build --no-restore'
      headless_test_command:
        required: false
        type: string
        default: 'dotnet test --no-build --no-restore'
      headless_test_results_path:
        required: false
        type: string
        default: ''

      android_enabled:
        description: Run Android product-shape validation
        required: false
        type: boolean
        default: true
      android_runner:
        required: false
        type: string
        default: ubuntu-latest
      android_setup_command:
        description: Workload/Android SDK setup command for the caller project
        required: false
        type: string
        default: 'dotnet workload install maui-android --skip-manifest-update'
      android_restore_command:
        description: Android restore command; required when android_enabled is true
        required: false
        type: string
        default: 'echo "android_restore_command must be configured when android_enabled=true" >&2; exit 2'
      android_build_command:
        description: Android build/publish command; required when android_enabled is true
        required: false
        type: string
        default: 'echo "android_build_command must be configured when android_enabled=true" >&2; exit 2'
      android_test_command:
        description: Android test/product verification command; required when android_enabled is true
        required: false
        type: string
        default: 'echo "android_test_command must be configured when android_enabled=true" >&2; exit 2'
      android_test_results_path:
        required: false
        type: string
        default: ''
      android_runtime_setup_command:
        description: Optional setup immediately before Android runtime/emulator smoke validation
        required: false
        type: string
        default: ''
      android_runtime_smoke_command:
        description: Optional runtime/emulator smoke command run after normal Android build/test validation
        required: false
        type: string
        default: ''
      android_runtime_java_distribution:
        description: setup-java distribution used when Android runtime smoke is enabled
        required: false
        type: string
        default: microsoft
      android_runtime_java_version:
        description: JDK version used when Android runtime smoke is enabled; leave empty to skip setup-java
        required: false
        type: string
        default: '21'
      android_runtime_timeout_minutes:
        description: Job timeout when Android runtime smoke is enabled
        required: false
        type: number
        default: 45

      windows_enabled:
        description: Run Windows product-shape validation
        required: false
        type: boolean
        default: true
      windows_runner:
        required: false
        type: string
        default: windows-latest
      windows_setup_command:
        description: Workload/setup command for Windows MAUI validation
        required: false
        type: string
        default: 'dotnet workload install maui --skip-manifest-update'
      windows_restore_command:
        description: Windows restore command; required when windows_enabled is true
        required: false
        type: string
        default: 'echo "windows_restore_command must be configured when windows_enabled=true" >&2; exit 2'
      windows_build_command:
        description: Windows build/publish command; required when windows_enabled is true
        required: false
        type: string
        default: 'echo "windows_build_command must be configured when windows_enabled=true" >&2; exit 2'
      windows_test_command:
        description: Windows smoke/product verification command; required when windows_enabled is true
        required: false
        type: string
        default: 'echo "windows_test_command must be configured when windows_enabled=true" >&2; exit 2'
      windows_test_results_path:
        required: false
        type: string
        default: ''
    secrets:
      nuget_token:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  headless:
    name: MAUI shared/headless
    if: inputs.headless_enabled
    uses: $/.github/workflows/profile-dotnet.yml
    with:
      ref: ${{ inputs.ref }}
      runner: ${{ inputs.headless_runner }}
      global_json_file: ${{ inputs.global_json_file }}
      dotnet_version: ${{ inputs.dotnet_version }}
      cache: ${{ inputs.cache }}
      cache_dependency_path: ${{ inputs.cache_dependency_path }}
      setup_command: ${{ inputs.headless_setup_command }}
      restore_command: ${{ inputs.headless_restore_command }}
      build_command: ${{ inputs.headless_build_command }}
      test_command: ${{ inputs.headless_test_command }}
      test_results_path: ${{ inputs.headless_test_results_path }}
      artifact_name: maui-headless-results
    secrets:
      nuget_token: ${{ secrets.nuget_token }}

  android:
    name: MAUI Android
    if: inputs.android_enabled && inputs.android_runtime_smoke_command == ''
    uses: $/.github/workflows/profile-dotnet.yml
    with:
      ref: ${{ inputs.ref }}
      runner: ${{ inputs.android_runner }}
      global_json_file: ${{ inputs.global_json_file }}
      dotnet_version: ${{ inputs.dotnet_version }}
      cache: ${{ inputs.cache }}
      cache_dependency_path: ${{ inputs.cache_dependency_path }}
      setup_command: ${{ inputs.android_setup_command }}
      restore_command: ${{ inputs.android_restore_command }}
      build_command: ${{ inputs.android_build_command }}
      test_command: ${{ inputs.android_test_command }}
      test_results_path: ${{ inputs.android_test_results_path }}
      artifact_name: maui-android-results
    secrets:
      nuget_token: ${{ secrets.nuget_token }}

  android-runtime:
    name: MAUI Android runtime smoke
    if: inputs.android_enabled && inputs.android_runtime_smoke_command != ''
    runs-on: ${{ inputs.android_runner }}
    timeout-minutes: ${{ inputs.android_runtime_timeout_minutes }}
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.nuget_token }}

    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up .NET from global.json
        if: inputs.global_json_file != '' && !inputs.cache
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ inputs.global_json_file }}

      - name: Set up .NET version
        if: inputs.global_json_file == '' && !inputs.cache
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Set up .NET from global.json with NuGet cache
        if: inputs.global_json_file != '' && inputs.cache
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ inputs.global_json_file }}
          cache: true
          cache-dependency-path: ${{ inputs.cache_dependency_path }}

      - name: Set up .NET version with NuGet cache
        if: inputs.global_json_file == '' && inputs.cache
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          cache: true
          cache-dependency-path: ${{ inputs.cache_dependency_path }}

      - name: Set up JDK for runtime smoke
        if: inputs.android_runtime_java_version != ''
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: ${{ inputs.android_runtime_java_distribution }}
          java-version: ${{ inputs.android_runtime_java_version }}

      - name: Repository-specific Android setup
        if: inputs.android_setup_command != ''
        shell: bash
        run: ${{ inputs.android_setup_command }}

      - name: Restore Android dependencies
        shell: bash
        run: ${{ inputs.android_restore_command }}

      - name: Build Android product
        shell: bash
        run: ${{ inputs.android_build_command }}

      - name: Test Android product
        shell: bash
        run: ${{ inputs.android_test_command }}

      - name: Runtime-specific setup
        if: inputs.android_runtime_setup_command != ''
        shell: bash
        run: ${{ inputs.android_runtime_setup_command }}

      - name: Run Android runtime smoke
        shell: bash
        run: ${{ inputs.android_runtime_smoke_command }}

      - name: Require and upload Android test results
        if: inputs.android_test_results_path != '' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maui-android-results-${{ inputs.android_runner }}
          path: ${{ inputs.android_test_results_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Summarize Android runtime profile
        if: always()
        shell: bash
        run: |
          {
            echo "### Shared MAUI Android runtime validation"
            echo
            echo "- Runner: \`${{ inputs.android_runner }}\`"
            echo "- Runtime smoke: enabled"
            echo "- Runtime JDK: \`${{ inputs.android_runtime_java_version || '(caller-managed)' }}\`"
            echo "- Test results required: \`${{ inputs.android_test_results_path != '' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: MAUI Windows
    if: inputs.windows_enabled
    uses: $/.github/workflows/profile-dotnet.yml
    with:
      ref: ${{ inputs.ref }}
      runner: ${{ inputs.windows_runner }}
      global_json_file: ${{ inputs.global_json_file }}
      dotnet_version: ${{ inputs.dotnet_version }}
      cache: ${{ inputs.cache }}
      cache_dependency_path: ${{ inputs.cache_dependency_path }}
      setup_command: ${{ inputs.windows_setup_command }}
      restore_command: ${{ inputs.windows_restore_command }}
      build_command: ${{ inputs.windows_build_command }}
      test_command: ${{ inputs.windows_test_command }}
      test_results_path: ${{ inputs.windows_test_results_path }}
      artifact_name: maui-windows-results
    secrets:
      nuget_token: ${{ secrets.nuget_token }}
