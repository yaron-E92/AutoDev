name: Issue 180 canonical coordinator cleanup

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: issue-180-canonical-coordinators-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply canonical coordinator cleanup
        run: python scripts/issue_180_canonical_coordinators.py

      - name: Compile canonical modules
        run: python -m compileall -q automation area_reader tests

      - name: Verify canonical coordinator behavior
        run: |
          python -m unittest \
            tests.test_autodev_cli \
            tests.test_ci_outcomes \
            tests.test_execution_classification_hooks \
            tests.test_opencode_integration \
            tests.test_opencode_privacy_role_entrypoint \
            tests.test_opencode_resume \
            tests.test_privacy_consent \
            tests.test_privacy_consent_tty \
            tests.test_privacy_grants \
            tests.test_role_runtime \
            tests.test_role_runtime_diagnostics \
            tests.test_role_workflow_hooks \
            tests.test_windows_verification

      - name: Reject compatibility coordinators
        shell: bash
        run: |
          set -euo pipefail
          test ! -e automation/role_coordinator.py
          test ! -e automation/opencode_coordinator.py
          test ! -e tests/test_opencode_coordinator.py
          if git grep -n 'role_coord_\|opencode_coord_\|opencode_coordinator' -- automation tests ':!scripts/issue_180_canonical_coordinators.py'; then
            echo 'obsolete coordinator compatibility remains' >&2
            exit 1
          fi

      - name: Commit verified coordinator cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add automation tests
          if git diff --cached --quiet; then
            echo "Canonical coordinator cleanup already applied."
          else
            git diff --cached --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'refactor: remove compatibility coordinators'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
