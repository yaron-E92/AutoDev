name: Issue 181 remove workflow compatibility adapter

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove monkeypatch compatibility adapter
        run: python scripts/issue_181_remove_workflow_compat.py

      - name: Compile maintained Python
        run: python -m compileall -q automation area_reader tests

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Reject workflow compatibility adapter
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '_sync_compat_overrides|_compat_entrypoint|_install_compat_entrypoints|monkeypatch-friendly|compatibility edge' -- automation/workflow_stages.py; then
            echo 'workflow_stages compatibility adapter remains' >&2
            exit 1
          fi

      - name: Commit verified workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A automation tests
          git reset -- scripts/issue_181_remove_workflow_compat.py || true
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor: remove workflow monkeypatch compatibility adapter'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
