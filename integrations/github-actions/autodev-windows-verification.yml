name: AutoDev Windows verification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit pushed by AutoDev
        required: true
        type: string
      source_identity:
        description: AutoDev verified source identity
        required: true
        type: string
      commands_json:
        description: JSON array of named Windows verification commands
        required: true
        type: string
      autodev_ref:
        description: Exact AutoDev revision whose Windows worker must be used
        required: true
        type: string

jobs:
  windows:
    name: Windows / exact source
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Reject a stale dispatch ref
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if ($env:DISPATCH_SHA -ne $env:EXPECTED_SHA) {
            throw "AutoDev Windows verification ref mismatch: expected $env:EXPECTED_SHA, workflow is running for $env:DISPATCH_SHA"
          }

      - name: Check out exact target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          path: target
          persist-credentials: false

      - name: Check out exact AutoDev worker
        uses: actions/checkout@v4
        with:
          repository: yaron-E92/AutoDev
          ref: ${{ inputs.autodev_ref }}
          path: autodev-tooling
          persist-credentials: false

      - name: Configure Yaref92 GitHub Packages when required
        shell: pwsh
        env:
          YAREF92_NUGET_TOKEN: ${{ secrets.YARE92_NUGET_TOKEN_EXP_17JUN2027 }}
        run: |
          $packageFiles = Get-ChildItem "$env:GITHUB_WORKSPACE\target" -Recurse -File `
            -Include *.csproj,*.props,*.targets,packages.lock.json
          $usesYaref92Events = $packageFiles |
            Select-String -SimpleMatch "Yaref92.Events" |
            Select-Object -First 1

          if ($null -eq $usesYaref92Events) {
            Write-Host "Yaref92.Events is not referenced; skipping authenticated GitHub Packages setup."
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:YAREF92_NUGET_TOKEN)) {
            throw "The target references Yaref92.Events, but Actions secret YARE92_NUGET_TOKEN_EXP_17JUN2027 is unavailable."
          }

          dotnet nuget add source https://nuget.pkg.github.com/yaron-E92/index.json `
            --name yaref92-github `
            --username Yaron-E92 `
            --password "$env:YAREF92_NUGET_TOKEN" `
            --store-password-in-clear-text
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to configure the authenticated Yaref92 GitHub Packages source."
          }
      - name: Execute Windows verification
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_IDENTITY: ${{ inputs.source_identity }}
          COMMANDS_JSON: ${{ inputs.commands_json }}
        run: |
          & "$env:GITHUB_WORKSPACE\autodev-tooling\windows\scripts\windows-verification-worker.ps1" `
            -RepositoryPath "$env:GITHUB_WORKSPACE\target" `
            -ExpectedSha $env:EXPECTED_SHA `
            -SourceIdentity $env:SOURCE_IDENTITY `
            -CommandsJson $env:COMMANDS_JSON
