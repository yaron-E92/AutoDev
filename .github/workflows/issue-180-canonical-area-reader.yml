name: Issue 180 canonical area reader cleanup

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: issue-180-canonical-area-reader-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply canonical area-reader cleanup
        run: |
          python scripts/issue_180_canonical_area_reader.py
          python scripts/issue_180_retarget_area_reader_tests.py

      - name: Compile canonical modules
        run: python -m compileall -q automation area_reader tests

      - name: Verify area-reader and canonical issue workflow behavior
        run: |
          python -m unittest \
            tests.test_command_group_recommendations \
            tests.test_headroom_area_reader \
            tests.test_model_roles \
            tests.test_run_real_issue \
            tests.test_run_resume

      - name: Reject obsolete area-reader names and compatibility core
        shell: bash
        run: |
          set -euo pipefail
          test ! -e area_reader_v2
          test ! -e area_reader/runner_core.py
          if git grep -n 'area_reader_v2\|area-reader v2\|Area Reader v2' -- ':!scripts/issue_180_canonical_area_reader.py' ':!.github/workflows/issue-180-canonical-area-reader.yml'; then
            echo 'obsolete area-reader naming remains' >&2
            exit 1
          fi

      - name: Commit verified area-reader cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Canonical area-reader cleanup already applied."
          else
            git diff --cached --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'refactor: make area reader canonical'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
