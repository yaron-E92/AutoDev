name: Issue 181 remove remaining compatibility facades

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: issue-181-facades-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  remove-facades:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Normalize facade migration edge cases
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('scripts/issue_181_remove_remaining_facades.py')
          text = migration.read_text(encoding='utf-8')
          marker = '        "with_headroom_role": "provider_headroom",\n'
          addition = marker + ''.join(
              f'        "{name}": "headroom",\n'
              for name in (
                  'HeadroomConfig',
                  'HeadroomError',
                  'headroom_config_from_values',
                  'prepare_prompt',
                  'proxy_headers',
              )
          )
          if marker not in text:
              raise SystemExit('model-provider mapping marker missing')
          text = text.replace(marker, addition, 1)
          old = '''            for facade in FACADES:\n                if re.search(rf"\\b(?:automation\\.)?{re.escape(facade)}\\b", text):\n                    leftovers.append(f"{path.relative_to(ROOT)}: {facade}")\n'''
          new = '''            for facade in FACADES:\n                patterns = (\n                    rf"\\bautomation\\.{re.escape(facade)}\\b",\n                    rf"\\bfrom\\s+automation\\s+import[^\\n]*\\b{re.escape(facade)}\\b",\n                    rf"\\b{re.escape(facade)}\\.",\n                    rf"\\bpatch\\.object\\(\\s*{re.escape(facade)}\\b",\n                )\n                if any(re.search(pattern, text) for pattern in patterns):\n                    leftovers.append(f"{path.relative_to(ROOT)}: {facade}")\n'''
          if old not in text:
              raise SystemExit('facade leftover detector marker missing')
          migration.write_text(text.replace(old, new, 1), encoding='utf-8')

          queue_selection = Path('automation/queue_selection.py')
          qtext = queue_selection.read_text(encoding='utf-8')
          start = qtext.find('class _IssueQueueCompat:')
          end = qtext.find('ROADMAP_PATH =', start)
          if start < 0 or end < 0:
              raise SystemExit('queue selection compatibility block not found')
          qtext = qtext[:start] + qtext[end:]
          qtext = qtext.replace('issue_queue._run_gh', '_run_gh')
          qtext = qtext.replace('issue_queue._json_result', '_json_result')
          qtext = qtext.replace('issue_queue.inspect_queue', 'inspect_queue')
          qtext = qtext.replace('issue_queue.reconcile_queue', 'reconcile_queue')
          queue_selection.write_text(qtext, encoding='utf-8')
          PY

      - name: Retarget facade consumers to owner modules
        run: python scripts/issue_181_remove_remaining_facades.py

      - name: Compile maintained Python
        run: python -m compileall -q automation area_reader tests

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Reject compatibility facades and references
        shell: bash
        run: |
          set -euo pipefail
          facades=(model_providers issue_queue distributed_claims privacy_grants scheduler_health semantic_repair_budget)
          for facade in "${facades[@]}"; do
            test ! -e "automation/${facade}.py"
            if git grep -n -E "(automation\.${facade}|from automation import.*${facade}|${facade}\.)" -- automation area_reader tests ':!scripts/issue_181_*'; then
              echo "Compatibility facade reference remains: ${facade}" >&2
              exit 1
            fi
          done
          if git grep -n -F '_IssueQueueCompat' -- automation tests; then
            echo 'Queue selection compatibility object remains.' >&2
            exit 1
          fi

      - name: Commit verified facade removal
        shell: bash
        run: |
          set -euo pipefail
          git add -A automation area_reader tests
          git reset -- scripts/issue_181_remove_remaining_facades.py || true
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor: remove compatibility aggregation facades'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
