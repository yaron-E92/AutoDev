name: Issue 180 final architecture cleanup

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: issue-180-final-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply final canonical architecture cleanup
        run: python scripts/issue_180_canonical_reachability.py

      - name: Compile canonical Python
        run: python -m compileall -q automation area_reader tests

      - name: Run architecture guard
        run: python -m unittest -v tests.test_python_architecture

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Commit verified canonical cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A CONTRIBUTING.md docs tests scripts .github/workflows
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'docs: align architecture with canonical runtime'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
