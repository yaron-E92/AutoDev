name: Issue 181 remove legacy prompt runner

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Extract canonical planner parser
        run: python scripts/issue_181_extract_planner_output.py

      - name: Compile maintained Python
        run: python -m compileall -q automation area_reader tests

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Reject legacy prompt runner
        shell: bash
        run: |
          set -euo pipefail
          test ! -e automation/prompt_runner.py
          test -e automation/planner_output.py
          test ! -e tests/test_prompt_runner.py
          if git grep -n -E 'prompt_runner|PromptRunnerError|run_command_provider|run_ollama_provider|verifier-format' -- automation area_reader tests docs README.md CONTRIBUTING.md ':!scripts/issue_181_extract_planner_output.py'; then
            echo 'Legacy prompt-runner surface remains.' >&2
            exit 1
          fi

      - name: Commit verified planner parser extraction
        shell: bash
        run: |
          set -euo pipefail
          git add -A automation area_reader tests docs README.md CONTRIBUTING.md
          git reset -- scripts/issue_181_extract_planner_output.py || true
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor: keep only canonical planner output parsing'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
