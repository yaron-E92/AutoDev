name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_call:
    inputs:
      ref:
        description: Optional exact ref/SHA to validate when CI is reused
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  AUTODEV_CI_REF: ${{ inputs.ref || github.sha }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version-intent:
    name: Version intent
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/version-intent.yml
    with:
      pr_body: ${{ github.event.pull_request.body }}
      pr_number: ${{ github.event.pull_request.number }}
      head: ${{ github.sha }}
    permissions:
      contents: read
      pull-requests: read

  workflow-lint:
    name: Workflow lint and immutable refs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$GOBIN"
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          "$GOBIN/actionlint" -version

      - name: Lint every workflow
        shell: bash
        run: |
          "$RUNNER_TEMP/actionlint-bin/actionlint" -color

      - name: Reject mutable external action refs
        run: python -m automation.validate_workflows --repo .

  release-reproducibility:
    name: Release bundle reproducibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Build the same release twice
        shell: bash
        run: |
          set -euo pipefail
          validated_sha="$(git rev-parse HEAD)"
          python -m automation.package_release --repo . --out "$RUNNER_TEMP/release-a" --version v0.0.0-ci --commit "$validated_sha"
          python -m automation.package_release --repo . --out "$RUNNER_TEMP/release-b" --version v0.0.0-ci --commit "$validated_sha"
          diff -ru "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b"

  version-policy-action:
    name: Shared policy actions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}
          fetch-depth: 0

      - name: Show runner Node runtime
        run: node --version

      - name: Run dependency-free version-policy tests
        run: node --test .github/actions/version-policy/index.test.js

      - name: Run dependency-free workflow-policy tests
        run: node --test .github/actions/workflow-policy/index.test.js

      - name: Exercise version-policy Action runtime directly
        id: version-smoke
        uses: ./.github/actions/version-policy
        with:
          mode: check-pr
          pr-body: '+semver: none'
          head: HEAD

      - name: Verify version-policy smoke outputs
        shell: bash
        env:
          BUMP: ${{ steps.version-smoke.outputs.bump }}
          TAG_REQUIRED: ${{ steps.version-smoke.outputs.tag_required }}
        run: |
          set -euo pipefail
          [[ "$BUMP" == "none" ]]
          [[ "$TAG_REQUIRED" == "false" ]]

      - name: Exercise workflow-policy Action runtime directly
        id: workflow-smoke
        uses: ./.github/actions/workflow-policy
        with:
          workflows-path: .github/workflows
          require-concurrency: false

      - name: Verify workflow-policy smoke outputs
        shell: bash
        env:
          CHECKED_FILES: ${{ steps.workflow-smoke.outputs.checked_files }}
        run: |
          set -euo pipefail
          [[ "$CHECKED_FILES" =~ ^[1-9][0-9]*$ ]]

  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall automation area_reader tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run canonical AutoDev CLI smoke tests
        run: >-
          python -m unittest -v
          tests.test_autodev_cli.AutoDevCliTests.test_existing_commands_share_opencode_entrypoint_core
          tests.test_role_runtime.RuntimeAgnosticCoordinatorTests.test_mock_runtime_executes_reader_synthesizer_planner_through_same_coordinator

  native-packaging:
    name: Native installer verification
    uses: ./.github/workflows/native-packaging.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      version: v0.0.0
      release_packaging: false
    permissions:
      contents: read

  oci-ux-integration:
    name: OCI UX resolver integration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install pinned ORAS
        shell: bash
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/oras-bin"
          mkdir -p "$GOBIN"
          go install oras.land/oras/cmd/oras@v1.3.2
          echo "$GOBIN" >> "$GITHUB_PATH"
          "$GOBIN/oras" version

      - name: Start pinned local OCI registry
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm             --name autodev-ux-registry             -p 5000:5000             registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/v2/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs autodev-ux-registry
          exit 1

      - name: Publish and resolve a real OCI UX bundle
        shell: bash
        env:
          AUTODEV_OCI_PLAIN_HTTP: "1"
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/ux-bundle"
          mkdir -p "$bundle"
          printf 'product: demo\n' > "$bundle/contract.yaml"
          printf '# Shared principles\n' > "$bundle/principles.md"
          cat > "$bundle/ux-manifest.json" <<'JSON'
          {
            "schema": "autodev.ux.bundle/v1",
            "product": "demo",
            "contract": "contract.yaml",
            "principles": "principles.md"
          }
          JSON

          python -m automation.autodev_cli ux publish "$bundle"             --to oci://127.0.0.1:5000/autodev/ux/demo:ci             --json > "$RUNNER_TEMP/published.json"

          immutable="$(
            python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["immutable_reference"])'               "$RUNNER_TEMP/published.json"
          )"

          python -m automation.autodev_cli ux inspect "$immutable" --json             > "$RUNNER_TEMP/inspected.json"

          python - "$RUNNER_TEMP/published.json" "$RUNNER_TEMP/inspected.json" <<'PY'
          import json
          import sys

          published = json.load(open(sys.argv[1], encoding="utf-8"))
          inspected = json.load(open(sys.argv[2], encoding="utf-8"))
          assert published["immutable_identity"].startswith("sha256:")
          assert published["immutable_reference"].startswith(
              "oci://127.0.0.1:5000/autodev/ux/demo@sha256:"
          )
          assert inspected["resolver_kind"] == "oci"
          assert inspected["artifact_type"] == "application/vnd.autodev.ux.bundle.v1"
          assert inspected["bundle"]["schema"] == "autodev.ux.bundle/v1"
          assert inspected["bundle"]["product"] == "demo"
          assert inspected["validation"] == "valid"
          PY

      - name: Stop local OCI registry
        if: always()
        shell: bash
        run: docker rm -f autodev-ux-registry >/dev/null 2>&1 || true

  bash-syntax:
    name: Bash syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}

      - name: Validate tracked Bash scripts
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' script; do
            found=1
            echo "Checking $script"
            bash -n "$script"
          done < <(git ls-files -z -- '*.sh')

          if [[ "$found" -eq 0 ]]; then
            echo "No tracked Bash scripts found; nothing to validate."
          fi

  powershell-syntax:
    name: PowerShell syntax
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}

      - name: Validate tracked PowerShell scripts
        shell: pwsh
        run: |
          $files = @(git ls-files -- '*.ps1')
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
          if ($files.Count -eq 0) {
              Write-Host 'No tracked PowerShell scripts found; nothing to validate.'
              exit 0
          }

          $failed = $false
          foreach ($file in $files) {
              Write-Host "Checking $file"
              $tokens = $null
              $errors = $null
              $path = (Resolve-Path -LiteralPath $file).Path
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $path,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null

              foreach ($error in $errors) {
                  Write-Host "ERROR ${file}:$($error.Extent.StartLineNumber):$($error.Extent.StartColumnNumber): $($error.Message)"
                  $failed = $true
              }
          }

          if ($failed) {
              exit 1
          }

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}

      - name: Reject tracked generated artifacts and caches
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' forbidden < <(
            git ls-files -z |
              grep -zE '(^|/)(\.pytest_cache|__pycache__|\.autodev-run|\.benchmark-results)(/|$)|\.py[co]$' || true
          )

          if ((${#forbidden[@]} > 0)); then
            printf 'Forbidden tracked artifact: %s\n' "${forbidden[@]}" >&2
            exit 1
          fi

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - version-intent
      - workflow-lint
      - release-reproducibility
      - version-policy-action
      - python
      - oci-ux-integration
      - native-packaging
      - bash-syntax
      - powershell-syntax
      - repository-hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Require all source validation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_INTENT: ${{ needs.version-intent.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          RELEASE_REPRODUCIBILITY: ${{ needs.release-reproducibility.result }}
          VERSION_POLICY_ACTION: ${{ needs.version-policy-action.result }}
          PYTHON: ${{ needs.python.result }}
          OCI_UX_INTEGRATION: ${{ needs.oci-ux-integration.result }}
          NATIVE_PACKAGING: ${{ needs.native-packaging.result }}
          BASH_SYNTAX: ${{ needs.bash-syntax.result }}
          POWERSHELL_SYNTAX: ${{ needs.powershell-syntax.result }}
          REPOSITORY_HYGIENE: ${{ needs.repository-hygiene.result }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$VERSION_INTENT" == "success" ]] || {
              echo "Version intent did not succeed: $VERSION_INTENT" >&2
              exit 1
            }
          elif [[ "$VERSION_INTENT" != "skipped" && "$VERSION_INTENT" != "success" ]]; then
            echo "Unexpected version-intent result for $EVENT_NAME: $VERSION_INTENT" >&2
            exit 1
          fi

          for result in \
            "$WORKFLOW_LINT" \
            "$RELEASE_REPRODUCIBILITY" \
            "$VERSION_POLICY_ACTION" \
            "$PYTHON" \
            "$OCI_UX_INTEGRATION" \
            "$NATIVE_PACKAGING" \
            "$BASH_SYNTAX" \
            "$POWERSHELL_SYNTAX" \
            "$REPOSITORY_HYGIENE"
          do
            [[ "$result" == "success" ]] || {
              echo "Required source-validation job did not succeed: $result" >&2
              exit 1
            }
          done

  version-tag:
    name: Advance version tag
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      always() &&
      needs.ci-gate.result == 'success'
    needs:
      - ci-gate
    uses: ./.github/workflows/version-tag.yml
    with:
      head: ${{ github.sha }}
      branch: main
    permissions:
      contents: write
      pull-requests: read
