name: Issue 181 final reachability audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Report production import reachability
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import ast
          import re
          from pathlib import Path

          root = Path('.')
          modules: dict[str, Path] = {}
          for package in ('automation', 'area_reader'):
              for path in (root / package).rglob('*.py'):
                  rel = path.relative_to(root).with_suffix('')
                  parts = list(rel.parts)
                  if parts[-1] == '__init__':
                      parts = parts[:-1]
                  modules['.'.join(parts)] = path

          edges: dict[str, set[str]] = {name: set() for name in modules}
          for name, path in modules.items():
              try:
                  tree = ast.parse(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  print(f'PARSE_ERROR {path}: {exc}')
                  continue
              package = name.rsplit('.', 1)[0] if '.' in name else name
              for node in ast.walk(tree):
                  candidates: list[str] = []
                  if isinstance(node, ast.Import):
                      candidates.extend(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom):
                      base = node.module or ''
                      if node.level:
                          parts = package.split('.')
                          keep = max(0, len(parts) - node.level + 1)
                          prefix = '.'.join(parts[:keep])
                          base = '.'.join(part for part in (prefix, base) if part)
                      if base:
                          candidates.append(base)
                          candidates.extend(f'{base}.{alias.name}' for alias in node.names)
                  for candidate in candidates:
                      probe = candidate
                      while probe:
                          if probe in modules:
                              edges[name].add(probe)
                              break
                          probe = probe.rpartition('.')[0]

          roots = {'automation.autodev_cli', 'automation.package_release', 'automation.validate_workflows'}
          pattern = re.compile(r'(?:python(?:3)?\s+-m\s+|from\s+|import\s+)(automation|area_reader)\.([A-Za-z0-9_\.]+)')
          for path in root.rglob('*'):
              if not path.is_file() or any(part in {'.git', '__pycache__', 'tests'} for part in path.parts):
                  continue
              if path.suffix.lower() not in {'.yml', '.yaml', '.sh', '.ps1', '.cmd', '.md', '.json', '.toml', '.py'}:
                  continue
              if path.parts and path.parts[0] in {'automation', 'area_reader'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              for match in pattern.finditer(text):
                  candidate = f'{match.group(1)}.{match.group(2).rstrip(".")}'
                  probe = candidate
                  while probe:
                      if probe in modules:
                          roots.add(probe)
                          break
                      probe = probe.rpartition('.')[0]

          reachable = set()
          stack = [root for root in roots if root in modules]
          while stack:
              item = stack.pop()
              if item in reachable:
                  continue
              reachable.add(item)
              stack.extend(edges.get(item, ()))

          print('ROOTS')
          for item in sorted(roots):
              print(item)
          print('\nUNREACHABLE')
          for item in sorted(set(modules) - reachable):
              print(item)
          print(f'\nTOTAL={len(modules)} REACHABLE={len(reachable)} UNREACHABLE={len(set(modules)-reachable)}')
          PY
