name: Issue 181 claim test isolation repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Repair isolated claim test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_distributed_claims.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import automation.claim_recovery as claim_recovery\n\n', '', 1)
          text = text.replace(
              'def test_queue_claim_policy_is_bounded_and_backwards_compatible(self):',
              'def test_queue_claim_policy_defaults_when_optional_fields_are_omitted(self):',
              1,
          )
          text = text.replace('            legacy = claim_identity.load_claim_policy(repo)\n            self.assertEqual(legacy.max_concurrent_issues, 1)\n            self.assertEqual(legacy.lease_minutes, 120)\n',
                              '            defaults = claim_identity.load_claim_policy(repo)\n            self.assertEqual(defaults.max_concurrent_issues, 1)\n            self.assertEqual(defaults.lease_minutes, 120)\n', 1)
          text = text.replace('patch.object(claim_repository, "_delete_with_lease",\n            return_value=False,\n        )',
                              'patch.object(claim_recovery, "_delete_with_lease",\n            return_value=False,\n        )', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/issue-181-test-isolation-fix.yml

      - name: Compile maintained Python
        run: python -m compileall -q automation area_reader tests

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Verify canonical CLI smoke
        run: python -m automation.autodev_cli --help > /dev/null

      - name: Commit verified repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'test: isolate stale claim reconciliation CAS'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
