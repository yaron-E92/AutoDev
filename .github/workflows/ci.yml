name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Optional exact ref/SHA to validate when CI is reused
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  AUTODEV_CI_REF: ${{ inputs.ref || github.sha }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version-intent:
    name: Version intent
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Validate explicit +semver intent and candidate version
        id: version
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          python -m automation.version_policy check-pr --repo . --body-env PR_BODY
          {
            echo "### Version intent"
            echo
            echo "This pull request has an explicit, valid \`+semver:\` directive."
            echo "Version tags are advanced only after successful trusted \`main\` CI."
            echo "Creating a version tag does **not** publish a release."
          } >> "$GITHUB_STEP_SUMMARY"

  workflow-lint:
    name: Workflow lint and immutable refs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$GOBIN"
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          "$GOBIN/actionlint" -version

      - name: Lint every workflow
        shell: bash
        run: |
          "$RUNNER_TEMP/actionlint-bin/actionlint" -color

      - name: Reject mutable external action refs
        run: python -m automation.validate_workflows --repo .

  release-reproducibility:
    name: Release bundle reproducibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Build the same release twice
        shell: bash
        run: |
          set -euo pipefail
          validated_sha="$(git rev-parse HEAD)"
          python -m automation.package_release --repo . --out "$RUNNER_TEMP/release-a" --version v0.0.0-ci --commit "$validated_sha"
          python -m automation.package_release --repo . --out "$RUNNER_TEMP/release-b" --version v0.0.0-ci --commit "$validated_sha"
          diff -ru "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b"

  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall automation area_reader_v2 benchmarks tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run mocked issue-to-PR smoke tests
        run: >-
          python -m unittest -v
          tests.test_run_real_issue.RunRealIssueTests.test_plan_only_uses_reader_provider_for_planning_not_coder_provider
          tests.test_run_real_issue.RunRealIssueTests.test_dry_run_implementation_calls_coder_and_saves_patch

  bash-syntax:
    name: Bash syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}

      - name: Validate tracked Bash scripts
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' script; do
            found=1
            echo "Checking $script"
            bash -n "$script"
          done < <(git ls-files -z -- '*.sh')

          if [[ "$found" -eq 0 ]]; then
            echo "No tracked Bash scripts found." >&2
            exit 1
          fi

  powershell-syntax:
    name: PowerShell syntax
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}

      - name: Validate tracked PowerShell scripts
        shell: pwsh
        run: |
          $files = @(git ls-files -- '*.ps1')
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
          if ($files.Count -eq 0) {
              throw 'No tracked PowerShell scripts found.'
          }

          $failed = $false
          foreach ($file in $files) {
              Write-Host "Checking $file"
              $tokens = $null
              $errors = $null
              $path = (Resolve-Path -LiteralPath $file).Path
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $path,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null

              foreach ($error in $errors) {
                  Write-Host "ERROR ${file}:$($error.Extent.StartLineNumber):$($error.Extent.StartColumnNumber): $($error.Message)"
                  $failed = $true
              }
          }

          if ($failed) {
              exit 1
          }

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}

      - name: Reject tracked generated artifacts and caches
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' forbidden < <(
            git ls-files -z |
              grep -zE '(^|/)(\.pytest_cache|__pycache__|\.autodev-run|\.benchmark-results)(/|$)|\.py[co]$' || true
          )

          if ((${#forbidden[@]} > 0)); then
            printf 'Forbidden tracked artifact: %s\n' "${forbidden[@]}" >&2
            exit 1
          fi

  version-tag:
    name: Advance version tag
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      always() &&
      needs.workflow-lint.result == 'success' &&
      needs.release-reproducibility.result == 'success' &&
      needs.python.result == 'success' &&
      needs.bash-syntax.result == 'success' &&
      needs.powershell-syntax.result == 'success' &&
      needs.repository-hygiene.result == 'success'
    needs:
      - workflow-lint
      - release-reproducibility
      - python
      - bash-syntax
      - powershell-syntax
      - repository-hygiene
    runs-on: ubuntu-latest
    concurrency:
      group: autodev-version-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check out exact successful main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Resolve change intent and create trusted annotated tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m automation.version_policy resolve-main \
            --repo . \
            --repository "$GITHUB_REPOSITORY" \
            --head "$GITHUB_SHA" \
            --branch main \
            --create-tag \
            --github-output "$GITHUB_OUTPUT"

      - name: Summarize version advancement
        shell: bash
        env:
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
          BUMP: ${{ steps.version.outputs.bump }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          TAG_REQUIRED: ${{ steps.version.outputs.tag_required }}
          TAG_STATUS: ${{ steps.version.outputs.tag_status }}
          SUPERSEDED: ${{ steps.version.outputs.superseded }}
        run: |
          {
            echo "### Version advancement"
            echo
            echo "- Base version: \`$BASE_VERSION\`"
            echo "- Highest intent: \`$BUMP\`"
            echo "- Candidate version: \`$VERSION\`"
            echo "- Tag: \`$TAG\`"
            echo "- Tag required: \`$TAG_REQUIRED\`"
            echo "- Tag status: \`$TAG_STATUS\`"
            echo "- Superseded main run: \`$SUPERSEDED\`"
            echo
            echo "This workflow advances version metadata only. **No release is published automatically.**"
          } >> "$GITHUB_STEP_SUMMARY"
