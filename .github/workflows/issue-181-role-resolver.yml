name: Issue 181 remove legacy role resolver

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove legacy reader/coder role resolver
        run: python scripts/issue_181_remove_legacy_role_resolver.py

      - name: Compile maintained Python
        run: python -m compileall -q automation area_reader tests

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Reject retired role resolver
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'resolve_role_configs|resolve_profile_roles|ROLE_FALLBACKS|legacy_reader_coder_fallbacks|legacy_cli_override' -- automation tests; then
            echo 'legacy role resolver remains' >&2
            exit 1
          fi

      - name: Commit verified role resolver cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A automation tests
          git reset -- scripts/issue_181_remove_legacy_role_resolver.py || true
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor: remove legacy reader coder role resolver'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
