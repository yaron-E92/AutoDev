name: Issue 181 usage audit

on:
  push:
    branches:
      - agent/issue-181-dead-code-cleanup

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Audit canonical and operational reachability
        run: python scripts/issue_181_usage_audit.py
