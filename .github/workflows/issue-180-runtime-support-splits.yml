name: Issue 180 runtime support splits

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: issue-180-runtime-support-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Compile migration driver
        run: python -m py_compile scripts/issue_180_split_runtime_support.py

      - name: Split semantic repair budgeting
        run: python scripts/issue_180_split_runtime_support.py repair-budget

      - name: Verify semantic repair budget split
        run: |
          python -m compileall -q automation
          python -m unittest \
            tests.test_semantic_repair_budget \
            tests.test_semantic_repair_default \
            tests.test_run_resume

      - name: Commit semantic repair budget split
        shell: bash
        run: |
          set -euo pipefail
          git add \
            automation/semantic_repair_budget.py \
            automation/repair_budget_contract.py \
            automation/repair_budget_metrics.py \
            automation/repair_budget_policy.py \
            automation/repair_budget_failure.py \
            automation/repair_budget_storage.py \
            automation/repair_budget_manifest.py \
            automation/repair_budget_resume.py
          if git diff --cached --quiet; then
            echo "Semantic repair budget already split."
          else
            git diff --cached --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'refactor: split semantic repair budget responsibilities'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Split issue queue
        run: python scripts/issue_180_split_runtime_support.py queue

      - name: Verify issue queue split
        run: |
          python -m compileall -q automation
          python -m unittest \
            tests.test_issue_queue \
            tests.test_queue_selection \
            tests.test_queue_cli_entrypoint \
            tests.test_queue_claim_selection \
            tests.test_scheduler_claims

      - name: Commit issue queue split
        shell: bash
        run: |
          set -euo pipefail
          git add \
            automation/issue_queue.py \
            automation/queue_contract.py \
            automation/queue_policy.py \
            automation/queue_github.py \
            automation/queue_classification.py \
            automation/queue_workflow.py \
            automation/queue_presentation.py \
            automation/queue_cli.py \
            automation/queue_selection.py
          if git diff --cached --quiet; then
            echo "Issue queue already split."
          else
            git diff --cached --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'refactor: split queue responsibilities and remove facade cycle'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Split model providers
        run: python scripts/issue_180_split_runtime_support.py providers

      - name: Verify model provider split
        run: |
          python -m compileall -q automation
          python -m unittest \
            tests.test_model_providers \
            tests.test_provider_agnostic \
            tests.test_headroom \
            tests.test_model_roles \
            tests.test_headroom_area_reader

      - name: Commit model provider split
        shell: bash
        run: |
          set -euo pipefail
          git add \
            automation/model_providers.py \
            automation/provider_contract.py \
            automation/provider_requests.py \
            automation/provider_command.py \
            automation/provider_http.py \
            automation/provider_headroom.py \
            automation/provider_mock.py \
            automation/provider_factory.py
          if git diff --cached --quiet; then
            echo "Model providers already split."
          else
            git diff --cached --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'refactor: split model provider responsibilities'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Split OpenCode resume
        run: python scripts/issue_180_split_runtime_support.py resume

      - name: Verify OpenCode resume split
        run: |
          python -m compileall -q automation
          python -m unittest \
            tests.test_opencode_resume \
            tests.test_opencode_resume_guardrails \
            tests.test_opencode_legacy_snapshot_compat \
            tests.test_run_resume \
            tests.test_opencode_integration

      - name: Commit OpenCode resume split
        shell: bash
        run: |
          set -euo pipefail
          git add \
            automation/opencode_resume.py \
            automation/opencode_resume_contract.py \
            automation/opencode_resume_manifest.py \
            automation/opencode_resume_checkpoint.py \
            automation/opencode_resume_status.py \
            automation/opencode_resume_execution.py
          if git diff --cached --quiet; then
            echo "OpenCode resume already split."
          else
            git diff --cached --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'refactor: split OpenCode resume responsibilities'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
