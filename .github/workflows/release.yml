name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing trusted version tag to publish (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  ci:
    name: Required CI for selected tag
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}
    # Reusable-workflow permission validation includes every nested job, even jobs
    # whose `if` condition is false for workflow_call. ci.yml contains the
    # main-only version-tag job, so this caller must allow its declared ceiling.
    # Other jobs in ci.yml remain constrained by their own read-only permissions.
    permissions:
      contents: write
      pull-requests: read

  native-release:
    name: Prepare native release packages
    needs: ci
    uses: ./.github/workflows/native-packaging.yml
    with:
      ref: ${{ inputs.tag }}
      version: ${{ inputs.tag }}
      release_packaging: true
    permissions:
      contents: read

  sign-windows:
    name: Sign Windows MSI
    needs: native-release
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Resolve new-release or idempotent-rerun signing path
        id: signed-input
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $plain = $env:RELEASE_TAG.TrimStart('v')
          $name = "AutoDev-$plain-Setup.msi"
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "msi=artifacts/release/windows/$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "unsigned=artifacts/release/windows-unsigned/$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $encodedReleaseTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedReleaseTag"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2026-03-10"
          }
          try {
            Invoke-RestMethod -Method Get -Uri $releaseUri -Headers $headers | Out-Null
            $releaseExists = $true
          }
          catch {
            $statusCode = $_.Exception.Response.StatusCode
            if ($null -ne $statusCode -and [int]$statusCode -eq 404) {
              $releaseExists = $false
            }
            else {
              throw
            }
          }

          if ($releaseExists) {
            "reuse=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          else {
            "reuse=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Check out release signer for a new release
        if: steps.signed-input.outputs.reuse != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download prepared unsigned MSI for a new release
        if: steps.signed-input.outputs.reuse != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autodev-native-windows
          path: artifacts/release/windows-unsigned

      - name: Sign MSI with protected self-signed PFX
        if: steps.signed-input.outputs.reuse != 'true'
        shell: pwsh
        env:
          AUTODEV_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.AUTODEV_WINDOWS_SIGNING_PFX_BASE64 }}
          AUTODEV_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.AUTODEV_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: >-
          ./automation/sign_windows_release.ps1
          -InputMsi '${{ steps.signed-input.outputs.unsigned }}'
          -OutputMsi '${{ steps.signed-input.outputs.msi }}'

      - name: Check out release signer for an idempotent rerun
        if: steps.signed-input.outputs.reuse == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download existing signed MSI for an idempotent rerun
        if: steps.signed-input.outputs.reuse == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          MSI_NAME: ${{ steps.signed-input.outputs.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'artifacts/release/windows' -Force | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $env:MSI_NAME `
            --dir 'artifacts/release/windows'
          $existing = Join-Path 'artifacts/release/windows' $env:MSI_NAME
          if (-not (Test-Path -LiteralPath $existing -PathType Leaf)) {
            throw "Existing release $env:RELEASE_TAG does not contain expected signed MSI $env:MSI_NAME."
          }

      - name: Verify reused signed MSI against protected PFX
        if: steps.signed-input.outputs.reuse == 'true'
        shell: pwsh
        env:
          AUTODEV_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.AUTODEV_WINDOWS_SIGNING_PFX_BASE64 }}
          AUTODEV_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.AUTODEV_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: >-
          ./automation/sign_windows_release.ps1
          -InputMsi '${{ steps.signed-input.outputs.msi }}'
          -VerifyOnly

      - name: Upload verified signed MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autodev-native-windows-signed
          path: artifacts/release/windows/*.msi
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Package, attest, and publish
    needs:
      - native-release
      - sign-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Validate requested existing version tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Release tag must be canonical vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out exact existing tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Verify immutable release identity
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "Requested release tag does not exist: $RELEASE_TAG" >&2
            exit 1
          }
          tag_type="$(git cat-file -t "refs/tags/$RELEASE_TAG")"
          [[ "$tag_type" == "tag" ]] || {
            echo "Requested release ref must be an annotated tag, got: $tag_type" >&2
            exit 1
          }
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          head_sha="$(git rev-parse HEAD)"
          [[ "$tag_sha" == "$head_sha" ]] || {
            echo "Tag $RELEASE_TAG resolves to $tag_sha, but checkout resolved to $head_sha" >&2
            exit 1
          }
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Manual release identity"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$tag_sha\`"
            echo
            echo "Required CI verified native reproducibility and install/upgrade behavior against this exact tag."
            echo "A separate release-packaging path built MSI, DEB, and RPM artifacts once using the real release version."
            echo "The Windows MSI was then Authenticode-signed in the trusted manual release path."
            echo "This release was started manually; version-tag creation alone does not publish releases."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download verified signed Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autodev-native-windows-signed
          path: artifacts/release/native

      - name: Download prepared Linux native installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autodev-native-linux
          path: artifacts/release/native

      - name: Build deterministic release bundles and bind final native artifacts
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          python -m automation.package_release \
            --repo . \
            --target publish \
            --version "$RELEASE_TAG" \
            --commit "$RELEASE_SHA" \
            --native-dir artifacts/release/native
          (cd artifacts/release/publish && sha256sum -c SHA256SUMS)

      - name: Generate build provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: artifacts/release/publish/SHA256SUMS

      - name: Create release or prove identical idempotent rerun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p artifacts/release/existing
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir artifacts/release/existing
            for current in artifacts/release/publish/*; do
              name="$(basename "$current")"
              previous="artifacts/release/existing/$name"
              [[ -f "$previous" ]] || {
                echo "Existing release is missing expected asset $name; refusing to replace it." >&2
                exit 1
              }
              cmp --silent "$current" "$previous" || {
                echo "Existing release asset $name differs from the artifact set for $RELEASE_SHA; refusing replacement." >&2
                exit 1
              }
            done
            echo "Release $RELEASE_TAG already contains byte-identical assets; idempotent rerun complete."
            exit 0
          fi

          # AutoDev may have newer version tags that have never been published as
          # releases. Generated release notes must therefore start at the most
          # recent published release, not at GitHub's nearest preceding Git tag.
          previous_release_tag="$(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --exclude-drafts \
              --order desc \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName // ""'
          )"
          notes_start_args=()
          if [[ -n "$previous_release_tag" ]]; then
            echo "Generating release notes from previous published release $previous_release_tag."
            notes_start_args=(--notes-start-tag "$previous_release_tag")
          else
            echo "No previous published release found; generating release notes without an explicit start tag."
          fi

          gh release create "$RELEASE_TAG" artifacts/release/publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            "${notes_start_args[@]}"
