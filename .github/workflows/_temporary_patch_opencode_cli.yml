name: Temporary OpenCode CLI resolver patch

on:
  push:
    branches:
      - agent/fix-opencode-cli-resolution

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-opencode-cli-resolution

      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter = Path('automation/opencode_adapter.py')
          text = adapter.read_text(encoding='utf-8')
          old = '''def resolve_opencode_model_mappings(
              repo: Path,
              *,
              runner=subprocess.run,
          ) -> dict[str, dict[str, str]]:
              repo = repo.expanduser().resolve()
              try:
                  completed = runner(
                      ["opencode", "debug", "config"],
                      cwd=repo,
                      text=True,
                      encoding="utf-8",
                      errors="replace",
                      capture_output=True,
                      check=False,
                  )
              except OSError as exc:
                  raise OpenCodeAdapterError(
                      "OpenCode model mapping introspection requires the `opencode` CLI"
                  ) from exc
              returncode = int(getattr(completed, "returncode", 1))
              if returncode != 0:
                  raise OpenCodeAdapterError(
                      f"opencode debug config failed with exit code {returncode}; fix OpenCode configuration before running AutoDev"
                  )
              raw = str(getattr(completed, "stdout", "") or "").strip()
          '''
          new = '''def resolve_opencode_model_mappings(
              repo: Path,
              *,
              runner=subprocess.run,
              which=None,
          ) -> dict[str, dict[str, str]]:
              repo = repo.expanduser().resolve()
              if which is None:
                  which = shutil.which if runner is subprocess.run else lambda command: command
              opencode_cli = which("opencode")
              if not opencode_cli:
                  raise OpenCodeAdapterError(
                      "OpenCode CLI was not found on PATH; model mapping introspection requires an installed `opencode` CLI"
                  )
              try:
                  completed = runner(
                      [opencode_cli, "debug", "config"],
                      cwd=repo,
                      text=True,
                      encoding="utf-8",
                      errors="replace",
                      capture_output=True,
                      check=False,
                  )
              except OSError as exc:
                  raise OpenCodeAdapterError(
                      f"OpenCode CLI resolved to {opencode_cli!r} but could not be launched: {exc}"
                  ) from exc
              returncode = int(getattr(completed, "returncode", 1))
              if returncode != 0:
                  stderr = str(getattr(completed, "stderr", "") or "").strip()
                  detail = f": {stderr}" if stderr else ""
                  raise OpenCodeAdapterError(
                      f"opencode debug config failed with exit code {returncode}{detail}; "
                      "fix OpenCode configuration before running AutoDev"
                  )
              raw = str(getattr(completed, "stdout", "") or "").strip()
          '''
          if old not in text:
              raise SystemExit('expected resolve_opencode_model_mappings block was not found')
          adapter.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_opencode_cli_resolution.py')
          tests.write_text('''import json\nimport tempfile\nimport unittest\nfrom pathlib import Path\nfrom types import SimpleNamespace\n\nfrom automation import opencode_adapter\n\n\nclass OpenCodeCliResolutionTests(unittest.TestCase):\n    def test_resolved_cli_path_is_used_for_introspection(self):\n        calls = []\n\n        def runner(command, **kwargs):\n            calls.append(command)\n            return SimpleNamespace(returncode=0, stdout=json.dumps({}), stderr="")\n\n        with tempfile.TemporaryDirectory() as temp_dir:\n            opencode_adapter.resolve_opencode_model_mappings(\n                Path(temp_dir),\n                runner=runner,\n                which=lambda command: r"C:\\\\Users\\\\user\\\\AppData\\\\Roaming\\\\npm\\\\opencode.CMD",\n            )\n\n        self.assertEqual(\n            calls,\n            [[r"C:\\\\Users\\\\user\\\\AppData\\\\Roaming\\\\npm\\\\opencode.CMD", "debug", "config"]],\n        )\n\n    def test_missing_cli_has_specific_discovery_error(self):\n        with tempfile.TemporaryDirectory() as temp_dir:\n            with self.assertRaises(opencode_adapter.OpenCodeAdapterError) as raised:\n                opencode_adapter.resolve_opencode_model_mappings(\n                    Path(temp_dir),\n                    runner=lambda *args, **kwargs: None,\n                    which=lambda command: None,\n                )\n\n        self.assertIn("not found on PATH", str(raised.exception))\n\n    def test_resolved_but_unlaunchable_cli_has_specific_launch_error(self):\n        def runner(command, **kwargs):\n            raise FileNotFoundError(2, "The system cannot find the file specified")\n\n        with tempfile.TemporaryDirectory() as temp_dir:\n            with self.assertRaises(opencode_adapter.OpenCodeAdapterError) as raised:\n                opencode_adapter.resolve_opencode_model_mappings(\n                    Path(temp_dir),\n                    runner=runner,\n                    which=lambda command: r"C:\\\\npm\\\\opencode.CMD",\n                )\n\n        message = str(raised.exception)\n        self.assertIn("resolved to", message)\n        self.assertIn("could not be launched", message)\n        self.assertIn("opencode.CMD", message)\n\n    def test_nonzero_debug_config_reports_exit_code_and_stderr(self):\n        def runner(command, **kwargs):\n            return SimpleNamespace(returncode=7, stdout="", stderr="bad OpenCode config")\n\n        with tempfile.TemporaryDirectory() as temp_dir:\n            with self.assertRaises(opencode_adapter.OpenCodeAdapterError) as raised:\n                opencode_adapter.resolve_opencode_model_mappings(\n                    Path(temp_dir),\n                    runner=runner,\n                    which=lambda command: "/usr/local/bin/opencode",\n                )\n\n        message = str(raised.exception)\n        self.assertIn("exit code 7", message)\n        self.assertIn("bad OpenCode config", message)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          Path('.github/workflows/_temporary_patch_opencode_cli.yml').unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve OpenCode CLI before introspection"
          git push origin HEAD:agent/fix-opencode-cli-resolution
