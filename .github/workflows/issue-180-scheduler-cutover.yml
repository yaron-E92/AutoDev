name: Issue 180 scheduler cutover

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply deterministic cutover
        run: python scripts/issue_180_scheduler_cutover.py

      - name: Compile Python
        run: python -m compileall -q automation

      - name: Run scheduler regression tests
        run: python -m unittest tests.test_scheduler tests.test_scheduler_claims

      - name: Commit verified cutover when needed
        shell: bash
        run: |
          set -euo pipefail
          git add automation/scheduler.py automation/scheduler_registration.py
          if git diff --cached --quiet; then
            echo "Scheduler cutover already applied."
            exit 0
          fi
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor: cut scheduler over to cohesive modules'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
