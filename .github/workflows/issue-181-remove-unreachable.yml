name: Issue 181 remove unreachable production modules

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove unreachable standalone modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for relative in (
              'area_reader/cli.py',
              'area_reader/execution.py',
              'area_reader/pipeline.py',
              'area_reader/provider.py',
              'area_reader/storage.py',
              'area_reader/workflow.py',
              'automation/semantic_cli.py',
          ):
              path = Path(relative)
              if path.exists():
                  path.unlink()

          path = Path('tests/test_model_roles.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from area_reader import workflow as area_runner\n', '')
          marker = '    def test_area_runner_records_reader_synthesizer_planner_order(self):\n'
          start = text.find(marker)
          if start >= 0:
              end = text.find('\n    def ', start + len(marker))
              if end < 0:
                  end = text.find('\n\nif __name__', start)
              if end < 0:
                  raise SystemExit('cannot bound standalone area-reader test')
              text = text[:start] + text[end:]
          path.write_text(text, encoding='utf-8')

          Path('area_reader/README.md').write_text(
              '# Area reader\n\n'
              'Area-reader functionality is an internal library used by the canonical `autodev` workflow. '
              'It is not a standalone command-line application.\n\n'
              'The maintained modules separate repository discovery, bounded context collection, routing, '
              'prompt construction, verification, recommendations, and settings. Canonical OpenCode roles '
              'import those responsibility modules directly.\n\n'
              'Run AutoDev through the installed `autodev` command rather than invoking modules in this package directly.\n',
              encoding='utf-8',
          )
          PY

      - name: Compile maintained Python
        run: python -m compileall -q automation area_reader tests

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Reject removed standalone paths
        shell: bash
        run: |
          set -euo pipefail
          removed=(
            area_reader/cli.py area_reader/execution.py area_reader/pipeline.py
            area_reader/provider.py area_reader/storage.py area_reader/workflow.py
            automation/semantic_cli.py
          )
          for path in "${removed[@]}"; do test ! -e "$path"; done
          if git grep -n -E 'area_reader\.(cli|execution|pipeline|provider|storage|workflow)|automation\.semantic_cli' -- automation area_reader tests docs README.md CONTRIBUTING.md; then
            echo 'Reference to removed standalone module remains.' >&2
            exit 1
          fi

      - name: Commit verified unreachable-module removal
        shell: bash
        run: |
          set -euo pipefail
          git add -A automation area_reader tests docs README.md CONTRIBUTING.md
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor: remove unreachable standalone modules'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
