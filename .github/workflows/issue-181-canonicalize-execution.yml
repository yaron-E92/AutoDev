name: Issue 181 canonicalize execution

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: issue-181-canonicalize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply canonical execution cleanup
        run: python scripts/issue_181_canonicalize_execution.py

      - name: Fix canonical product seams
        run: python scripts/issue_181_fix_canonical_product.py

      - name: Retarget tests to canonical assets
        run: |
          python scripts/issue_181_fix_canonical_tests.py
          python scripts/issue_181_fix_canonical_tests2.py
          python scripts/issue_181_fix_test_literals.py

      - name: Compile maintained Python
        run: python -m compileall -q automation area_reader tests

      - name: Run focused canonical suites
        run: >-
          python -m unittest -v
          tests.test_autodev_cli
          tests.test_opencode_installers
          tests.test_opencode_integration
          tests.test_opencode_interactive_consent
          tests.test_opencode_local_coordinator_hardening
          tests.test_opencode_role_boundary_contracts
          tests.test_repo_setup
          tests.test_windows_verification
          tests.test_python_architecture

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Reject retired execution surfaces
        shell: bash
        run: |
          set -euo pipefail
          test ! -e linux
          test ! -e integrations/opencode/autodev.py
          test ! -e integrations/opencode/autodev.ps1
          test ! -e integrations/opencode/python-commands
          test ! -e automation/workflow_stage_legacy.py
          test ! -e automation/workflow_verify_current.py
          test ! -e windows/scripts/issue-to-pr-cycle.ps1
          if git grep -n -E '(\.opencode/autodev\.(py|ps1|json)|python3? \.opencode/autodev\.py)' -- automation integrations/opencode; then
            echo 'Repository-local OpenCode bridge reference remains.' >&2
            exit 1
          fi

      - name: Commit verified canonical execution cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A automation integrations linux windows tests docs README.md CONTRIBUTING.md
          git reset -- scripts/issue_181_canonicalize_execution.py scripts/issue_181_fix_canonical_product.py scripts/issue_181_fix_canonical_tests.py scripts/issue_181_fix_canonical_tests2.py scripts/issue_181_fix_test_literals.py || true
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor: remove legacy execution surfaces'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
