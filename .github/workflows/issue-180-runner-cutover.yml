name: Issue 180 runner cutover

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Split issue runner by responsibility
        run: python scripts/issue_180_split_issue_runner.py

      - name: Compile Python
        run: python -m compileall -q automation

      - name: Run issue runner regression tests
        run: >-
          python -m unittest
          tests.test_run_real_issue
          tests.test_run_resume
          tests.test_semantic_verifier
          tests.test_semantic_verifier_failures
          tests.test_model_roles
          tests.test_headroom
          tests.test_opencode_integration

      - name: Commit verified runner cutover when needed
        shell: bash
        run: |
          set -euo pipefail
          git add automation/run_real_issue.py automation/run_real_issue_core.py automation/issue_run_*.py automation/issue_runner_*.py
          if git diff --cached --quiet; then
            echo "Runner cutover already applied."
            exit 0
          fi
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor: split issue runner by responsibility'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
