name: Issue 181 remove dead direct model invocation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove dead direct invocation path
        run: python scripts/issue_181_remove_direct_invocation.py

      - name: Compile maintained Python
        run: python -m compileall -q automation area_reader tests

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Reject retired direct invocation symbols
        shell: bash
        run: |
          set -euo pipefail
          test ! -e automation/model_roles.py
          if git grep -n -E 'invoke_semantic_verifier|invoke_model|ModelInvocationError|automation\.model_roles' -- automation area_reader integrations tests docs README.md CONTRIBUTING.md; then
            echo 'dead direct model invocation path remains' >&2
            exit 1
          fi

      - name: Commit verified direct invocation cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A automation tests
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor: remove dead direct model invocation path'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
