name: Reusable native package verification

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source ref/SHA to package
        required: false
        type: string
        default: ''
      version:
        description: Canonical vMAJOR.MINOR.PATCH package version
        required: false
        type: string
        default: v0.0.0

permissions:
  contents: read

jobs:
  windows:
    name: Native Windows MSI
    runs-on: windows-latest

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install frozen-runtime builder
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"

      - name: Locate pinned WiX toolchain
        shell: pwsh
        run: |
          $wix = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'
          if (-not (Test-Path (Join-Path $wix 'candle.exe'))) {
            throw "GitHub Windows runner does not provide WiX Toolset v3.14 at $wix"
          }
          "WIX=$wix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$wix;$env:PATH" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build self-contained payload twice
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          python -m automation.native_packaging --repo . --out "$env:RUNNER_TEMP\native-win-a" --version $env:PACKAGE_VERSION --commit $sha --platform windows
          python -m automation.native_packaging --repo . --out "$env:RUNNER_TEMP\native-win-b" --version $env:PACKAGE_VERSION --commit $sha --platform windows
          & "$env:RUNNER_TEMP\native-win-a\payload\autodev\autodev.exe" --version

          $a = Get-ChildItem "$env:RUNNER_TEMP\native-win-a\payload\autodev" -File -Recurse | ForEach-Object {
            $relative = $_.FullName.Substring(("$env:RUNNER_TEMP\native-win-a\payload\autodev").Length)
            "$relative $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)"
          } | Sort-Object
          $b = Get-ChildItem "$env:RUNNER_TEMP\native-win-b\payload\autodev" -File -Recurse | ForEach-Object {
            $relative = $_.FullName.Substring(("$env:RUNNER_TEMP\native-win-b\payload\autodev").Length)
            "$relative $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)"
          } | Sort-Object
          if (Compare-Object $a $b) {
            throw 'Repeated PyInstaller Windows payload builds are not byte-reproducible.'
          }

      - name: Build and normalize MSI twice
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $epoch = (git show -s --format=%ct $sha).Trim()
          $payload = "$env:RUNNER_TEMP\native-win-a\payload\autodev"
          python -m automation.native_windows --repo . --payload $payload --out "$env:RUNNER_TEMP\msi-a" --version $env:PACKAGE_VERSION --commit $sha
          python -m automation.native_windows --repo . --payload $payload --out "$env:RUNNER_TEMP\msi-b" --version $env:PACKAGE_VERSION --commit $sha
          $name = "AutoDev-$($env:PACKAGE_VERSION.TrimStart('v'))-Setup.msi"
          python -m automation.msi_reproducibility --msi "$env:RUNNER_TEMP\msi-a\$name" --epoch $epoch
          python -m automation.msi_reproducibility --msi "$env:RUNNER_TEMP\msi-b\$name" --epoch $epoch
          $hashA = (Get-FileHash "$env:RUNNER_TEMP\msi-a\$name" -Algorithm SHA256).Hash
          $hashB = (Get-FileHash "$env:RUNNER_TEMP\msi-b\$name" -Algorithm SHA256).Hash
          if ($hashA -ne $hashB) {
            throw "Repeated normalized MSI builds differ: $hashA != $hashB"
          }

      - name: Verify install, upgrade, failed upgrade preservation, and uninstall
        shell: pwsh
        run: |
          function Invoke-Msi([string[]] $Arguments, [bool] $ExpectSuccess = $true) {
            $process = Start-Process -FilePath msiexec.exe -ArgumentList $Arguments -Wait -PassThru
            $success = $process.ExitCode -eq 0 -or $process.ExitCode -eq 3010
            if ($ExpectSuccess -and -not $success) {
              throw "msiexec failed with exit code $($process.ExitCode): $($Arguments -join ' ')"
            }
            if (-not $ExpectSuccess -and $success) {
              throw "msiexec unexpectedly succeeded: $($Arguments -join ' ')"
            }
          }

          $sha = (git rev-parse HEAD).Trim()
          $epoch = (git show -s --format=%ct $sha).Trim()
          $payload = "$env:RUNNER_TEMP\native-win-a\payload\autodev"
          $installDir = Join-Path $env:RUNNER_TEMP 'AutoDev Install With Spaces'
          $state = Join-Path $HOME '.autodev'
          New-Item -ItemType Directory -Force $state | Out-Null
          Set-Content -Path (Join-Path $state 'native-installer-sentinel.txt') -Value 'preserve me'

          python -m automation.native_windows --repo . --payload $payload --out "$env:RUNNER_TEMP\upgrade-1" --version v0.0.1 --commit $sha
          python -m automation.native_windows --repo . --payload $payload --out "$env:RUNNER_TEMP\upgrade-2" --version v0.0.2 --commit $sha
          python -m automation.native_windows --repo . --payload $payload --out "$env:RUNNER_TEMP\upgrade-3" --version v0.0.3 --commit $sha
          foreach ($version in '1','2','3') {
            $msi = "$env:RUNNER_TEMP\upgrade-$version\AutoDev-0.0.$version-Setup.msi"
            python -m automation.msi_reproducibility --msi $msi --epoch $epoch
          }

          $first = "$env:RUNNER_TEMP\upgrade-1\AutoDev-0.0.1-Setup.msi"
          $second = "$env:RUNNER_TEMP\upgrade-2\AutoDev-0.0.2-Setup.msi"
          Invoke-Msi @('/i', "`"$first`"", '/qn', '/norestart', "INSTALLFOLDER=`"$installDir`"")
          & (Join-Path $installDir 'autodev.exe') --version
          Invoke-Msi @('/i', "`"$second`"", '/qn', '/norestart', "INSTALLFOLDER=`"$installDir`"")
          & (Join-Path $installDir 'autodev.exe') --help | Out-Null

          $registeredPath = (Get-ItemProperty -Path 'HKCU:\Environment' -Name Path -ErrorAction Stop).Path
          if ($registeredPath -notlike "*$installDir*") {
            throw "MSI did not register AutoDev on the user PATH: $registeredPath"
          }

          $broken = "$env:RUNNER_TEMP\broken-upgrade.msi"
          Copy-Item "$env:RUNNER_TEMP\upgrade-3\AutoDev-0.0.3-Setup.msi" $broken
          [IO.File]::WriteAllBytes($broken, [byte[]](1,2,3,4,5))
          Invoke-Msi @('/i', "`"$broken`"", '/qn', '/norestart', "INSTALLFOLDER=`"$installDir`"") $false
          & (Join-Path $installDir 'autodev.exe') --version

          Invoke-Msi @('/x', "`"$second`"", '/qn', '/norestart')
          if (Test-Path (Join-Path $installDir 'autodev.exe')) {
            throw 'MSI uninstall left the product executable installed.'
          }
          if (-not (Test-Path (Join-Path $state 'native-installer-sentinel.txt'))) {
            throw 'MSI uninstall removed user AutoDev state.'
          }

      - name: Upload Windows native installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autodev-native-windows
          path: ${{ runner.temp }}/msi-a/*.msi
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Native Linux DEB and RPM
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install native build tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pyinstaller==6.16.0'
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build self-contained payload twice
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          python -m automation.native_packaging --repo . --out "$RUNNER_TEMP/native-linux-a" --version "$PACKAGE_VERSION" --commit "$sha" --platform posix
          python -m automation.native_packaging --repo . --out "$RUNNER_TEMP/native-linux-b" --version "$PACKAGE_VERSION" --commit "$sha" --platform posix
          "$RUNNER_TEMP/native-linux-a/payload/autodev/autodev" --version

          (cd "$RUNNER_TEMP/native-linux-a/payload/autodev" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/payload-a.sha256"
          (cd "$RUNNER_TEMP/native-linux-b/payload/autodev" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/payload-b.sha256"
          diff -u "$RUNNER_TEMP/payload-a.sha256" "$RUNNER_TEMP/payload-b.sha256"
          (cd "$RUNNER_TEMP/native-linux-a/payload/autodev" && find . -type l -printf '%p -> %l\n' | sort) > "$RUNNER_TEMP/payload-a.links"
          (cd "$RUNNER_TEMP/native-linux-b/payload/autodev" && find . -type l -printf '%p -> %l\n' | sort) > "$RUNNER_TEMP/payload-b.links"
          diff -u "$RUNNER_TEMP/payload-a.links" "$RUNNER_TEMP/payload-b.links"

      - name: Build DEB and RPM twice reproducibly
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          payload="$RUNNER_TEMP/native-linux-a/payload/autodev"
          python -m automation.native_linux --repo . --payload "$payload" --out "$RUNNER_TEMP/linux-packages-a" --version "$PACKAGE_VERSION" --commit "$sha"
          python -m automation.native_linux --repo . --payload "$payload" --out "$RUNNER_TEMP/linux-packages-b" --version "$PACKAGE_VERSION" --commit "$sha"
          plain="${PACKAGE_VERSION#v}"
          cmp "$RUNNER_TEMP/linux-packages-a/autodev_${plain}_amd64.deb" "$RUNNER_TEMP/linux-packages-b/autodev_${plain}_amd64.deb"
          cmp "$RUNNER_TEMP/linux-packages-a/autodev-${plain}-1.x86_64.rpm" "$RUNNER_TEMP/linux-packages-b/autodev-${plain}-1.x86_64.rpm"
          dpkg-deb --info "$RUNNER_TEMP/linux-packages-a/autodev_${plain}_amd64.deb"
          rpm -qpi "$RUNNER_TEMP/linux-packages-a/autodev-${plain}-1.x86_64.rpm"
          rpm -qpl "$RUNNER_TEMP/linux-packages-a/autodev-${plain}-1.x86_64.rpm" | grep -Fx '/usr/bin/autodev'

      - name: Verify Debian install, upgrade, recovery path, and uninstall
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          epoch="$(git show -s --format=%ct "$sha")"
          payload="$RUNNER_TEMP/native-linux-a/payload/autodev"
          state="$HOME/.autodev"
          mkdir -p "$state"
          printf 'preserve me\n' > "$state/native-installer-sentinel.txt"

          python - <<'PY'
          import os
          from pathlib import Path
          from automation import native_linux

          payload = Path(os.environ['RUNNER_TEMP']) / 'native-linux-a' / 'payload' / 'autodev'
          out = Path(os.environ['RUNNER_TEMP']) / 'linux-upgrades'
          epoch = int(os.environ['SOURCE_EPOCH'])
          native_linux.build_deb(payload, out, 'v0.0.1', epoch)
          native_linux.build_deb(payload, out, 'v0.0.2', epoch)
          PY
        env:
          SOURCE_EPOCH: ${{ github.event.repository.updated_at && '0' || '0' }}

      - name: Complete Debian transactional smoke
        shell: bash
        run: |
          set -euo pipefail
          # Recompute the exact source epoch here instead of depending on wall-clock time.
          sha="$(git rev-parse HEAD)"
          epoch="$(git show -s --format=%ct "$sha")"
          payload="$RUNNER_TEMP/native-linux-a/payload/autodev"
          python -c "from pathlib import Path; from automation import native_linux; native_linux.build_deb(Path(r'$RUNNER_TEMP/native-linux-a/payload/autodev'), Path(r'$RUNNER_TEMP/linux-upgrades'), 'v0.0.1', int('$epoch')); native_linux.build_deb(Path(r'$RUNNER_TEMP/native-linux-a/payload/autodev'), Path(r'$RUNNER_TEMP/linux-upgrades'), 'v0.0.2', int('$epoch'))"
          sudo apt-get install -y "$RUNNER_TEMP/linux-upgrades/autodev_0.0.1_amd64.deb"
          autodev --version
          sudo apt-get install -y "$RUNNER_TEMP/linux-upgrades/autodev_0.0.2_amd64.deb"
          autodev --help >/dev/null

          cp "$RUNNER_TEMP/linux-upgrades/autodev_0.0.2_amd64.deb" "$RUNNER_TEMP/broken.deb"
          truncate -s 5 "$RUNNER_TEMP/broken.deb"
          if sudo dpkg -i "$RUNNER_TEMP/broken.deb"; then
            echo 'corrupted package unexpectedly installed' >&2
            exit 1
          fi
          autodev --version

          sudo apt-get remove -y autodev
          test ! -e /usr/bin/autodev
          test -f "$HOME/.autodev/native-installer-sentinel.txt"

      - name: Upload Linux native installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autodev-native-linux
          path: |
            ${{ runner.temp }}/linux-packages-a/*.deb
            ${{ runner.temp }}/linux-packages-a/*.rpm
          if-no-files-found: error
          retention-days: 7
