name: Issue 181 remove coder plan fallback

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove obsolete coder plan fallback
        run: python scripts/issue_181_remove_coder_plan_fallback.py

      - name: Compile maintained Python
        run: python -m compileall -q automation area_reader tests

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Reject retired coder plan artifact
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n 'coder-plan\.md' -- automation area_reader integrations tests docs README.md CONTRIBUTING.md; then
            echo 'retired coder-plan.md fallback remains' >&2
            exit 1
          fi

      - name: Commit verified coder plan cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A automation area_reader integrations tests docs README.md CONTRIBUTING.md
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor: remove obsolete coder plan fallback'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
