name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Optional exact ref/SHA to validate when CI is reused
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  AUTODEV_CI_REF: ${{ inputs.ref || github.sha }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version-intent:
    name: Version intent
    if: github.event_name == 'pull_request'
    uses: $/.github/workflows/version-intent.yml
    with:
      pr_body: ${{ github.event.pull_request.body }}
      head: ${{ github.sha }}
    permissions:
      contents: read

  workflow-lint:
    name: Baseline workflow policy
    uses: $/.github/workflows/profile-baseline.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      run_actionlint: true
      require_concurrency: false
    permissions:
      contents: read

  release-reproducibility:
    name: Release bundle reproducibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Build the same release twice
        shell: bash
        run: |
          set -euo pipefail
          validated_sha="$(git rev-parse HEAD)"
          python -m automation.package_release --repo . --out "$RUNNER_TEMP/release-a" --version v0.0.0-ci --commit "$validated_sha"
          python -m automation.package_release --repo . --out "$RUNNER_TEMP/release-b" --version v0.0.0-ci --commit "$validated_sha"
          diff -ru "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b"

  version-policy-action:
    name: Shared policy actions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}
          fetch-depth: 0

      - name: Show runner Node runtime
        run: node --version

      - name: Run dependency-free version-policy tests
        run: node --test .github/actions/version-policy/index.test.js

      - name: Run dependency-free workflow-policy tests
        run: node --test .github/actions/workflow-policy/index.test.js

      - name: Exercise version-policy Action runtime directly
        id: version-smoke
        uses: $/.github/actions/version-policy
        with:
          mode: check-pr
          pr-body: '+semver: none'
          head: HEAD

      - name: Verify version-policy smoke outputs
        shell: bash
        env:
          BUMP: ${{ steps.version-smoke.outputs.bump }}
          TAG_REQUIRED: ${{ steps.version-smoke.outputs.tag_required }}
        run: |
          set -euo pipefail
          [[ "$BUMP" == "none" ]]
          [[ "$TAG_REQUIRED" == "false" ]]

      - name: Exercise workflow-policy Action runtime directly
        id: workflow-smoke
        uses: $/.github/actions/workflow-policy
        with:
          workflows-path: .github/workflows
          require-concurrency: false

      - name: Verify workflow-policy smoke outputs
        shell: bash
        env:
          CHECKED_FILES: ${{ steps.workflow-smoke.outputs.checked_files }}
        run: |
          set -euo pipefail
          [[ "$CHECKED_FILES" =~ ^[1-9][0-9]*$ ]]

  python:
    name: Shared Python profile
    uses: $/.github/workflows/profile-python.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      runners: '["ubuntu-latest","windows-latest"]'
      python_versions: '["3.11","3.14"]'
      cache: false
      compile_command: 'python -m compileall automation area_reader_v2 benchmarks tests'
      test_command: |
        python -m unittest discover -s tests -v
        python -m unittest -v tests.test_run_real_issue.RunRealIssueTests.test_plan_only_uses_reader_provider_for_planning_not_coder_provider tests.test_run_real_issue.RunRealIssueTests.test_dry_run_implementation_calls_coder_and_saves_patch
    permissions:
      contents: read

  bash-syntax:
    name: Bash syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}

      - name: Validate tracked Bash scripts
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' script; do
            found=1
            echo "Checking $script"
            bash -n "$script"
          done < <(git ls-files -z -- '*.sh')

          if [[ "$found" -eq 0 ]]; then
            echo "No tracked Bash scripts found." >&2
            exit 1
          fi

  powershell-syntax:
    name: PowerShell syntax
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}

      - name: Validate tracked PowerShell scripts
        shell: pwsh
        run: |
          $files = @(git ls-files -- '*.ps1')
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
          if ($files.Count -eq 0) {
              throw 'No tracked PowerShell scripts found.'
          }

          $failed = $false
          foreach ($file in $files) {
              Write-Host "Checking $file"
              $tokens = $null
              $errors = $null
              $path = (Resolve-Path -LiteralPath $file).Path
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $path,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null

              foreach ($error in $errors) {
                  Write-Host "ERROR ${file}:$($error.Extent.StartLineNumber):$($error.Extent.StartColumnNumber): $($error.Message)"
                  $failed = $true
              }
          }

          if ($failed) {
              exit 1
          }

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AUTODEV_CI_REF }}

      - name: Reject tracked generated artifacts and caches
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' forbidden < <(
            git ls-files -z |
              grep -zE '(^|/)(\.pytest_cache|__pycache__|\.autodev-run|\.benchmark-results)(/|$)|\.py[co]$' || true
          )

          if ((${#forbidden[@]} > 0)); then
            printf 'Forbidden tracked artifact: %s\n' "${forbidden[@]}" >&2
            exit 1
          fi

  version-tag:
    name: Advance version tag
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      always() &&
      needs.workflow-lint.result == 'success' &&
      needs.release-reproducibility.result == 'success' &&
      needs.version-policy-action.result == 'success' &&
      needs.python.result == 'success' &&
      needs.bash-syntax.result == 'success' &&
      needs.powershell-syntax.result == 'success' &&
      needs.repository-hygiene.result == 'success'
    needs:
      - workflow-lint
      - release-reproducibility
      - version-policy-action
      - python
      - bash-syntax
      - powershell-syntax
      - repository-hygiene
    uses: $/.github/workflows/version-tag.yml
    with:
      head: ${{ github.sha }}
      branch: main
    permissions:
      contents: write
      pull-requests: read
